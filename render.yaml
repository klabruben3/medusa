services:
  # A Docker web service
  - type: web
    name: academiq-api
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_EVIDENCE_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_GRADING_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TPM_BUDGET
        value: "8000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_CONCURRENT_EXTRACTIONS
        value: "1"
